services:
  - type: web
    name: codex-android-bff
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/mojealterego/Codex-Android
    branch: codex/agent-runtime-p2
    autoDeployTrigger: off
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.server:create_runtime_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CODEX_BFF_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: codex-android-bff-state
          property: connectionString

databases:
  - name: codex-android-bff-state
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: codex_android_bff_state
